services:
  # 1. FastAPI Emergency Backend
  - type: web
    name: rakshapath-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: "/"
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"

  # 2. React Vite Frontend (Static Site on Render)
  - type: web
    name: rakshapath-frontend
    env: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
